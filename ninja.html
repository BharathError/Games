<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>SHADOW PROTOCOL: NEON BLADE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Orbitron:wght@900&display=swap');

        :root {
            --neon-cyan: #00f3ff;
            --neon-pink: #ff0055;
            --bg-dark: #050508;
        }

        * { box-sizing: border-box; touch-action: none; user-select: none; -webkit-user-select: none; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            overflow: hidden;
            font-family: 'Rajdhani', sans-serif;
            color: white;
            height: 100vh;
            width: 100vw;
        }

        #game-container { position: relative; width: 100%; height: 100%; }
        canvas { display: block; width: 100%; height: 100%; }

        /* UI LAYERS */
        .ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; z-index: 10;
        }

        .hud { padding: 20px; display: flex; justify-content: space-between; }
        
        .score-box {
            background: rgba(0,0,0,0.6); border-left: 4px solid var(--neon-cyan); padding: 5px 15px;
            backdrop-filter: blur(4px);
        }
        .score-val { font-family: 'Orbitron'; font-size: 28px; color: #fff; text-shadow: 0 0 10px var(--neon-cyan); }

        .menu-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5,5,8,0.9); backdrop-filter: blur(10px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 20; pointer-events: auto; transition: opacity 0.3s;
        }
        .hidden { opacity: 0; pointer-events: none; }

        h1 {
            font-family: 'Orbitron'; font-size: clamp(40px, 12vw, 80px); margin: 0;
            background: linear-gradient(to bottom, #fff, #888); -webkit-background-clip: text;
            -webkit-text-fill-color: transparent; text-shadow: 0 5px 20px rgba(0,243,255,0.4);
            text-align: center; line-height: 0.9;
        }
        h1 span { font-size: 0.4em; letter-spacing: 0.2em; color: var(--neon-pink); -webkit-text-fill-color: var(--neon-pink); display: block; }

        .btn-primary {
            margin-top: 40px; background: transparent; color: var(--neon-cyan);
            font-family: 'Orbitron'; font-size: 20px; padding: 15px 40px;
            border: 2px solid var(--neon-cyan); cursor: pointer;
            box-shadow: 0 0 15px rgba(0,243,255,0.2); transition: 0.2s;
            clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
        }
        .btn-primary:active { transform: scale(0.95); background: var(--neon-cyan); color: #000; }

        /* MOBILE CONTROLS */
        .controls-layer { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; pointer-events: none; z-index: 15; }
        @media (hover: none) and (pointer: coarse) { .controls-layer { display: block; } }

        .touch-zone { position: absolute; width: 120px; height: 120px; pointer-events: auto; display: flex; justify-content: center; align-items: center; }
        .control-btn {
            width: 70px; height: 70px; border-radius: 50%;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center;
            font-size: 24px; color: white; transition: 0.1s;
        }
        .control-btn:active { background: rgba(0,243,255,0.3); border-color: var(--neon-cyan); transform: scale(0.9); }

        #zone-left { left: 20px; bottom: 20px; }
        #zone-jump { right: 20px; bottom: 140px; }
        #zone-attack { right: 20px; bottom: 20px; }
        .attack-btn { width: 90px; height: 90px; background: rgba(255,0,85,0.15); border-color: rgba(255,0,85,0.3); font-size: 30px; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div class="ui-layer">
        <div class="hud">
            <div class="score-box">
                <span style="font-size:12px; color:#aaa; display:block">SCORE</span>
                <span class="score-val" id="scoreDisplay">0000</span>
            </div>
        </div>
        <div class="controls-layer">
            <div class="touch-zone" id="zone-left"><div class="control-btn">▼</div></div>
            <div class="touch-zone" id="zone-jump"><div class="control-btn">▲</div></div>
            <div class="touch-zone" id="zone-attack"><div class="control-btn attack-btn">⚔️</div></div>
        </div>
    </div>

    <div id="mainMenu" class="menu-screen">
        <h1>NEON<br><span>RONIN</span></h1>
        <button class="btn-primary" onclick="game.start()">ENGAGE</button>
        <div style="margin-top:15px; color:#666; font-size:12px;">Desktop: Space (Jump) | Down (Slide) | F (Attack)</div>
    </div>

    <div id="gameOverMenu" class="menu-screen hidden">
        <h1 style="color:var(--neon-pink)">K.I.A.</h1>
        <div style="font-size:20px; margin: 10px 0; color:#fff;">SCORE: <span id="finalScore">0</span></div>
        <button class="btn-primary" onclick="game.start()">REBOOT</button>
    </div>
</div>

<script>
/**
 * NEON RONIN ENGINE
 * Procedural Animation & Humanoid Rendering
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });

const CONFIG = {
    gravity: 2200,
    jumpForce: -950,
    groundY: 0,
    baseSpeed: 550,
    maxSpeed: 1400,
    colors: {
        bg: '#050508',
        player: '#00f3ff', // Cyan
        enemy: '#ff0055',  // Pink/Red
        ground: '#1a1a20'
    }
};

const Input = {
    keys: { jump: false, slide: false, attack: false },
    init() {
        window.addEventListener('keydown', e => this.handleKey(e, true));
        window.addEventListener('keyup', e => this.handleKey(e, false));
        this.bindTouch('zone-jump', 'jump');
        this.bindTouch('zone-left', 'slide');
        this.bindTouch('zone-attack', 'attack');
    },
    handleKey(e, isDown) {
        if(e.code === 'Space' || e.code === 'ArrowUp') this.set('jump', isDown);
        if(e.code === 'ArrowDown') this.set('slide', isDown);
        if(e.code === 'KeyF') this.set('attack', isDown);
    },
    bindTouch(id, action) {
        const el = document.getElementById(id);
        if(!el) return;
        el.addEventListener('touchstart', e => { e.preventDefault(); this.set(action, true); }, {passive:false});
        el.addEventListener('touchend', e => { e.preventDefault(); this.set(action, false); }, {passive:false});
    },
    set(action, active) {
        if(active && !this.keys[action]) game.onInput(action);
        this.keys[action] = active;
    }
};

const game = {
    lastTime: 0, running: false, speed: 0, score: 0, animTime: 0,
    player: null, obstacles: [], particles: [],
    
    init() {
        this.resize();
        window.addEventListener('resize', () => this.resize());
        Input.init();
        requestAnimationFrame(this.loop.bind(this));
    },
    resize() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        ctx.scale(dpr, dpr);
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        CONFIG.groundY = this.height - 120;
    },
    start() {
        document.getElementById('mainMenu').classList.add('hidden');
        document.getElementById('gameOverMenu').classList.add('hidden');
        this.running = true;
        this.score = 0;
        this.speed = CONFIG.baseSpeed;
        this.player = new Player();
        this.obstacles = [];
        this.particles = [];
        this.lastTime = performance.now();
    },
    onInput(action) {
        if(!this.running) return;
        if(action === 'jump') this.player.jump();
        if(action === 'attack') this.player.attack();
    },
    loop(time) {
        const dt = Math.min((time - this.lastTime) / 1000, 0.1);
        this.lastTime = time;

        if(this.running) {
            this.update(dt);
            this.draw();
        }
        requestAnimationFrame(this.loop.bind(this));
    },
    update(dt) {
        this.animTime += dt * 10;
        this.speed = Math.min(this.speed + 10 * dt, CONFIG.maxSpeed);
        this.score += this.speed * dt * 0.05;
        
        // Spawn Obstacles
        if(Math.random() < 0.015 && this.obstacles.length < 3) {
            const minGap = 400 + (this.speed * 0.5);
            const lastX = this.obstacles.length ? this.obstacles[this.obstacles.length-1].x : 0;
            if(this.width - lastX > minGap) {
                this.obstacles.push(new Obstacle(this.width + 100));
            }
        }

        this.player.update(dt);
        
        // Obstacle Logic
        for(let i = this.obstacles.length-1; i >= 0; i--) {
            let ob = this.obstacles[i];
            ob.update(dt);
            if(ob.x < -100) this.obstacles.splice(i, 1);
            
            // Collision
            if(this.rectIntersect(this.player.hitbox, ob.hitbox)) {
                if(this.player.attacking && ob.type === 'SAMURAI') {
                    this.createExplosion(ob.x, ob.y, CONFIG.colors.enemy);
                    this.obstacles.splice(i, 1);
                    this.score += 100;
                } else {
                    this.gameOver();
                }
            }
        }

        this.particles.forEach((p,i) => {
            p.update(dt);
            if(p.life <= 0) this.particles.splice(i, 1);
        });
        
        document.getElementById('scoreDisplay').innerText = Math.floor(this.score);
    },
    draw() {
        // Clear & Background
        const grad = ctx.createLinearGradient(0,0,0,this.height);
        grad.addColorStop(0, '#020205');
        grad.addColorStop(1, '#111');
        ctx.fillStyle = grad;
        ctx.fillRect(0,0,this.width, this.height);

        // Ground
        ctx.fillStyle = CONFIG.colors.ground;
        ctx.fillRect(0, CONFIG.groundY, this.width, this.height);
        
        // Grid Effect on Ground
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 2;
        ctx.beginPath();
        let offset = (this.score * 10) % 100;
        for(let i=0; i<this.width+100; i+=100) {
            ctx.moveTo(i - offset, CONFIG.groundY);
            ctx.lineTo(i - offset - 100, this.height);
        }
        ctx.stroke();

        this.obstacles.forEach(o => o.draw());
        this.player.draw();
        this.particles.forEach(p => p.draw());
        
        // Neon Horizon Line
        ctx.shadowBlur = 15;
        ctx.shadowColor = CONFIG.colors.player;
        ctx.strokeStyle = CONFIG.colors.player;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, CONFIG.groundY);
        ctx.lineTo(this.width, CONFIG.groundY);
        ctx.stroke();
        ctx.shadowBlur = 0;
    },
    rectIntersect(r1, r2) {
        return !(r2.x > r1.x + r1.w || r2.x + r2.w < r1.x || r2.y > r1.y + r1.h || r2.y + r2.h < r1.y);
    },
    createExplosion(x, y, color) {
        for(let i=0; i<15; i++) this.particles.push(new Particle(x, y, color));
    },
    gameOver() {
        this.running = false;
        document.getElementById('finalScore').innerText = Math.floor(this.score);
        document.getElementById('gameOverMenu').classList.remove('hidden');
    }
};

/* --- ENTITIES --- */

class Player {
    constructor() {
        this.x = 80;
        this.y = CONFIG.groundY;
        this.vy = 0;
        this.w = 50; // Hitbox width
        this.h = 80; // Hitbox height (standing)
        this.grounded = true;
        this.sliding = false;
        this.attacking = false;
        this.attackTimer = 0;
        this.jumpCount = 0;
        this.scarf = [];
    }
    
    get hitbox() {
        return { 
            x: this.x - 15, // Center hitbox relative to draw pos
            y: this.y - this.h, 
            w: this.w, 
            h: this.h 
        };
    }

    jump() {
        if(this.grounded) {
            this.vy = CONFIG.jumpForce;
            this.grounded = false; this.jumpCount = 1;
        } else if(this.jumpCount < 2) {
            this.vy = CONFIG.jumpForce * 0.8;
            this.jumpCount = 2;
            game.createExplosion(this.x, this.y - 40, '#fff'); // Air jump effect
        }
    }
    attack() {
        if(!this.attacking) {
            this.attacking = true;
            this.attackTimer = 0.3;
        }
    }
    update(dt) {
        // Physics
        this.vy += CONFIG.gravity * dt;
        this.y += this.vy * dt;
        if(this.y >= CONFIG.groundY) {
            this.y = CONFIG.groundY;
            this.vy = 0;
            this.grounded = true;
            this.jumpCount = 0;
        }

        // Slide
        this.sliding = Input.keys.slide;
        this.h = this.sliding ? 40 : 80;

        // Attack
        if(this.attacking) {
            this.attackTimer -= dt;
            if(this.attackTimer <= 0) this.attacking = false;
        }

        // Scarf Physics
        this.scarf.unshift({x: this.x, y: this.y - (this.sliding ? 20 : 60)});
        if(this.scarf.length > 8) this.scarf.pop();
    }
    draw() {
        // Calculate procedural limb angles based on state
        const t = game.animTime;
        let headY = -70, bodyAng = 0.2, armL = 0, armR = 0, legL = 0, legR = 0;
        
        if(this.sliding) {
            headY = -30; bodyAng = -1.2; // Lean back
            legL = 1.5; legR = 0.5; // Legs forward
        } else if(!this.grounded) {
             // Jump Pose
            bodyAng = 0.4; legL = -0.5; legR = -1.0;
            armL = -2; armR = -2; // Arms up
        } else {
             // Run Cycle
            legL = Math.sin(t) * 0.8;
            legR = Math.sin(t + Math.PI) * 0.8;
            armL = Math.sin(t + Math.PI) * 0.8;
            armR = Math.sin(t) * 0.8;
            headY = -70 + Math.sin(t*2)*2; // Head bob
        }

        if(this.attacking) { armR = -1.5; bodyAng = 0.5; } // Sword arm raise

        ctx.save();
        ctx.translate(this.x, this.y);

        // 1. Draw Scarf (Trail)
        ctx.beginPath();
        ctx.strokeStyle = CONFIG.colors.player;
        ctx.lineWidth = 4;
        ctx.moveTo(0, headY + 10); // Connect to neck
        for(let i=0; i<this.scarf.length; i++) {
            let p = this.scarf[i];
            // Relative position + speed lag + wave
            let lx = (p.x - this.x) - (i * 15); 
            let ly = (p.y - this.y) + Math.sin(t*2 + i)*5;
            ctx.lineTo(lx, ly);
        }
        ctx.globalAlpha = 0.6;
        ctx.stroke();
        ctx.globalAlpha = 1.0;

        // 2. Draw Stickman Body
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        
        // Shadow/Glow
        ctx.shadowColor = CONFIG.colors.player;
        ctx.shadowBlur = 15;

        // Legs
        this.drawLimb(0, -40, legL, 25, 25);
        this.drawLimb(0, -40, legR, 25, 25);

        // Torso
        ctx.beginPath();
        ctx.moveTo(0, -40); // Hip
        ctx.lineTo(Math.sin(bodyAng)*30, headY); // Neck
        ctx.stroke();

        // Arms
        const neckX = Math.sin(bodyAng)*30;
        this.drawLimb(neckX, headY, armL, 20, 20);
        
        // Sword Arm
        ctx.save();
        ctx.translate(neckX, headY);
        ctx.rotate(armR);
        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.lineTo(0, 20); // Arm
        ctx.stroke();
        // Sword
        ctx.rotate(0.5); // Hold angle
        ctx.strokeStyle = CONFIG.colors.player;
        ctx.shadowColor = '#fff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, 20);
        ctx.lineTo(0, 70); // Blade length
        ctx.stroke();
        
        // Attack Swing Effect
        if(this.attacking) {
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.globalAlpha = 0.5;
            ctx.beginPath();
            ctx.arc(0, 20, 60, 0, Math.PI);
            ctx.stroke();
        }
        ctx.restore();

        // Head
        ctx.fillStyle = '#000';
        ctx.strokeStyle = CONFIG.colors.player;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(neckX, headY, 9, 0, Math.PI*2);
        ctx.fill();
        ctx.stroke();
        
        ctx.restore();
    }

    drawLimb(ox, oy, angle, len1, len2) {
        // Simple 2-segment limb IK-ish
        ctx.save();
        ctx.translate(ox, oy);
        ctx.rotate(angle);
        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.lineTo(0, len1);
        ctx.stroke();
        ctx.translate(0, len1);
        ctx.rotate(-Math.abs(angle) * 0.5 + 0.5); // Natural bend
        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.lineTo(0, len2);
        ctx.stroke();
        ctx.restore();
    }
}

class Obstacle {
    constructor(x) {
        this.x = x;
        this.type = Math.random() > 0.6 ? 'DRONE' : 'SAMURAI';
        this.w = 50;
        this.h = this.type === 'SAMURAI' ? 70 : 40;
        this.y = this.type === 'SAMURAI' ? CONFIG.groundY : CONFIG.groundY - 90 - Math.random()*50;
        this.timer = 0;
    }
    
    get hitbox() {
        return { x: this.x, y: this.y - this.h, w: this.w, h: this.h };
    }

    update(dt) {
        this.x -= game.speed * dt;
        this.timer += dt * 10;
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.shadowBlur = 10;
        ctx.shadowColor = CONFIG.colors.enemy;
        ctx.fillStyle = CONFIG.colors.enemy;

        if(this.type === 'SAMURAI') {
            // Draw Samurai (Blocky Armor style)
            const t = this.timer;
            // Legs
            const l1 = Math.sin(t)*10;
            const l2 = Math.sin(t + Math.PI)*10;
            ctx.fillRect(10 + l1, -30, 10, 30);
            ctx.fillRect(30 + l2, -30, 10, 30);
            
            // Body
            ctx.fillRect(5, -60, 40, 35);
            // Head (Helmet)
            ctx.fillRect(10, -75, 30, 20);
            // Horns
            ctx.beginPath();
            ctx.moveTo(10, -75); ctx.lineTo(0, -85); ctx.lineTo(15, -75);
            ctx.fill();
            // Glowing Eye
            ctx.fillStyle = '#fff';
            ctx.fillRect(15, -65, 20, 2);

        } else {
            // Drone
            ctx.translate(0, Math.sin(this.timer)*5 - 40);
            ctx.strokeStyle = CONFIG.colors.enemy;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(25, 0, 15, 0, Math.PI*2);
            ctx.stroke();
            // Spikes
            ctx.beginPath(); ctx.moveTo(5,0); ctx.lineTo(-10, 0); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(45,0); ctx.lineTo(60, 0); ctx.stroke();
            // Core
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(25, 0, 5, 0, Math.PI*2); ctx.fill();
        }

        ctx.restore();
    }
}

class Particle {
    constructor(x, y, color) {
        this.x = x; this.y = y; this.color = color;
        const a = Math.random() * Math.PI * 2;
        const s = Math.random() * 200 + 50;
        this.vx = Math.cos(a) * s; this.vy = Math.sin(a) * s;
        this.life = 1.0;
    }
    update(dt) {
        this.x += this.vx * dt; this.y += this.vy * dt;
        this.life -= dt * 2;
    }
    draw() {
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, 4, 4);
        ctx.globalAlpha = 1;
    }
}

game.init();
</script>
</body>
</html>
