<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEURAL BREACH // Protocol Beta</title>
    <meta name="description" content="Advanced Cyberpunk Memory Hacking Simulation">
    <style>
        /* --- CORE VARIABLES & RESET --- */
        :root {
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ff;
            --neon-green: #0aff00;
            --neon-red: #ff4444; /* Slightly softer red for better glow */
            --bg-dark: #02020a;
            --grid-gap: 10px; /* Slightly wider gap for heavier look */
            --font-main: 'Courier New', monospace;
        }

        * { box-sizing: border-box; touch-action: manipulation; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--neon-blue);
            font-family: var(--font-main);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        /* --- CRT & SCANLINE EFFECTS (Revised for softer look) --- */
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            /* Thicker, softer lines */
            background: repeating-linear-gradient(
                to bottom,
                rgba(0,0,0,0.1) 0px,
                rgba(0,0,0,0.1) 3px,
                rgba(0,0,0,0.2) 4px,
                rgba(0,0,0,0.2) 6px
            );
            pointer-events: none;
            z-index: 999;
        }
        .vignette {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 50%, rgba(0,0,0,0.9) 100%);
            pointer-events: none;
            z-index: 998;
        }

        /* --- UI LAYOUT --- */
        #game-container {
            width: 100%;
            max-width: 650px;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 10;
            background: rgba(0, 10, 20, 0.8); /* Solidify container */
        }

        /* HEADER HUD */
        .hud-top {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            background: rgba(0,0,0,0.8);
            border-bottom: 4px solid var(--neon-blue); /* Thicker border */
            box-shadow: 0 5px 15px rgba(0, 243, 255, 0.2);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .hud-stat { display: flex; flex-direction: column; align-items: center; }
        .hud-label { font-size: 0.8rem; color: #888; margin-bottom: 5px; font-weight: normal; }
        .hud-value { font-size: 1.4rem; text-shadow: 0 0 8px var(--neon-blue); }

        /* GAME AREA */
        #play-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px;
        }

        /* THE GRID - Heavier look */
        #grid-container {
            display: grid;
            gap: var(--grid-gap);
            background: rgba(0, 15, 30, 0.9); /* More solid background */
            padding: 15px;
            border: 3px solid var(--neon-blue); /* Thicker border */
            /* Outer and Inner glow for depth */
            box-shadow: 
                0 0 30px rgba(0, 243, 255, 0.15),
                inset 0 0 20px rgba(0, 243, 255, 0.1);
            transition: transform 0.5s ease;
            border-radius: 4px;
        }

        .tile {
            background: rgba(0, 40, 70, 0.6); /* Heavier base color */
            border: 2px solid rgba(0, 243, 255, 0.4); /* Thicker tile borders */
            cursor: pointer;
            transition: all 0.15s ease;
            position: relative;
            overflow: hidden;
            border-radius: 2px;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5); /* Inner shadow for depth */
        }
        .tile:active { transform: scale(0.96); }
        
        /* Tile States - Emphasizing solid fill over outlines */
        .tile.active-pattern {
            background: var(--neon-blue);
            box-shadow: 0 0 25px var(--neon-blue), inset 0 0 10px rgba(255,255,255,0.5);
            border-color: var(--neon-blue);
        }
        .tile.revealed-success {
            background: var(--neon-green);
            box-shadow: 0 0 25px var(--neon-green), inset 0 0 10px rgba(255,255,255,0.5);
            border-color: var(--neon-green);
        }
        .tile.revealed-fail {
            background: var(--neon-red);
            box-shadow: 0 0 25px var(--neon-red), inset 0 0 10px rgba(0,0,0,0.5);
            border-color: var(--neon-red);
            animation: shake 0.3s;
        }
        .tile.virus {
            background: rgba(60, 0, 0, 0.8);
            border: 3px solid var(--neon-red);
            box-shadow: inset 0 0 15px var(--neon-red);
        }
        .tile.virus.exposed {
            background: var(--neon-red);
            box-shadow: 0 0 30px var(--neon-red);
        }

        /* BOTTOM HUD / POWERUPS */
        .hud-bottom {
            padding: 20px;
            background: rgba(0,0,0,0.8);
            border-top: 4px solid var(--neon-blue);
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .powerup-btn {
            background: rgba(0, 243, 255, 0.1);
            border: 3px solid var(--neon-blue); /* Thicker borders */
            color: var(--neon-blue);
            padding: 12px 20px;
            font-family: var(--font-main);
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            position: relative;
            transition: 0.3s;
            text-transform: uppercase;
            box-shadow: inset 0 0 10px rgba(0, 243, 255, 0.2);
        }
        .powerup-btn:disabled { 
            opacity: 0.5; 
            cursor: not-allowed; 
            border-color: #444; 
            color: #666; 
            background: rgba(0,0,0,0.3);
            box-shadow: none;
        }
        .powerup-btn:hover:not(:disabled) { 
            background: var(--neon-blue); 
            color: var(--bg-dark);
            box-shadow: 0 0 20px var(--neon-blue); 
        }
        .powerup-cost { display: block; font-size: 0.7rem; margin-top: 4px; color: var(--neon-pink); }

        /* --- MENUS & OVERLAYS --- */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 2, 10, 0.98); /* More solid background */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(10px);
            transition: opacity 0.3s;
        }
        .hidden { opacity: 0; pointer-events: none; display: none !important; }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            /* Heavier text shadow */
            text-shadow: 3px 3px 0px var(--neon-pink), -3px -3px 0px var(--neon-blue);
            letter-spacing: 5px;
            text-align: center;
            font-weight: 900;
        }
        h2 { color: var(--neon-green); margin-bottom: 30px; font-size: 1.8rem; text-shadow: 0 0 10px var(--neon-green); }

        .menu-btn {
            background: rgba(0, 243, 255, 0.1);
            border: 4px solid var(--neon-blue); /* Much thicker menu buttons */
            color: #fff;
            padding: 18px 40px;
            margin: 12px;
            font-family: var(--font-main);
            font-size: 1.3rem;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: 0.2s;
            width: 85%;
            max-width: 350px;
            box-shadow: inset 0 0 20px rgba(0, 243, 255, 0.2);
            text-shadow: 0 0 5px var(--neon-blue);
        }
        .menu-btn:hover {
            background: var(--neon-blue);
            color: var(--bg-dark);
            box-shadow: 0 0 30px var(--neon-blue);
            text-shadow: none;
        }

        /* --- ANIMATIONS --- */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        
        .glitch-text { animation: glitch 2s infinite; }
        @keyframes glitch {
            0% { transform: skew(0deg); }
            20% { transform: skew(-2deg); }
            21% { transform: skew(20deg); }
            22% { transform: skew(0deg); }
            100% { transform: skew(0deg); }
        }

        /* PROGRESS BAR - Thicker */
        .timer-bar-container {
            width: 100%; height: 12px; background: #222; border-bottom: 2px solid #444;
        }
        .timer-bar {
            height: 100%; width: 100%; background: var(--neon-pink);
            box-shadow: 0 0 10px var(--neon-pink);
            transition: width 0.1s linear;
        }

        /* PARTICLES CANVAS */
        #bg-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.4;
        }

        /* NOTIFICATIONS - Bolder */
        #toast {
            position: fixed; top: 20%; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.95); 
            border: 3px solid var(--neon-green);
            color: var(--neon-green); padding: 15px 30px; z-index: 2000;
            opacity: 0; transition: opacity 0.5s; pointer-events: none;
            text-transform: uppercase; letter-spacing: 2px; font-weight: bold;
            box-shadow: 0 0 20px rgba(10, 255, 0, 0.3);
        }
    </style>
</head>
<body>

    <div class="scanlines"></div>
    <div class="vignette"></div>
    <canvas id="bg-canvas"></canvas>
    <div id="toast">System Override Active</div>

    <div id="menu-screen" class="overlay">
        <h1 class="glitch-text">NEURAL BREACH</h1>
        <div style="font-size: 1rem; color: var(--neon-blue); margin-bottom: 40px; font-weight: bold; letter-spacing: 1px;">PROTOCOL BETA // v1.1.0 HEAVY</div>
        
        <button class="menu-btn" onclick="Game.start('campaign')">Campaign Mode</button>
        <button class="menu-btn" onclick="Game.start('endless')">Infinite Breach</button>
        <button class="menu-btn" onclick="Game.start('blitz')">Binary Blitz (60s)</button>
        
        <div style="margin-top: 40px; text-align: center; background: rgba(0,0,0,0.5); padding: 20px; border: 2px solid #333;">
            <div style="color: var(--neon-blue); font-size: 1.2rem; margin-bottom: 10px;">TOTAL RAM: <span id="menu-ram" style="color: #fff; text-shadow: 0 0 10px var(--neon-blue);">0</span> MB</div>
            <button class="powerup-btn" style="margin-top: 5px; border-color: var(--neon-red); color: var(--neon-red);" onclick="Game.resetData()">RESET SYSTEM MEMORY</button>
        </div>
    </div>

    <div id="result-screen" class="overlay hidden">
        <h1 id="result-title">BREACH SUCCESS</h1>
        <h2 id="result-score">Score: 0</h2>
        <div id="result-details" style="margin-bottom: 30px; color: #fff; font-size: 1.2rem;"></div>
        <button class="menu-btn" id="next-level-btn" onclick="Game.nextLevel()">Next Level</button>
        <button class="menu-btn" style="border-color: var(--neon-pink);" onclick="Game.showMenu()">Return to Root</button>
    </div>

    <div id="game-container" class="hidden">
        <div class="timer-bar-container"><div id="timer-bar" class="timer-bar"></div></div>
        
        <div class="hud-top">
            <div class="hud-stat">
                <span class="hud-label">LEVEL</span>
                <span class="hud-value" id="hud-level">1</span>
            </div>
            <div class="hud-stat">
                <span class="hud-label">SCORE</span>
                <span class="hud-value" id="hud-score">0</span>
            </div>
            <div class="hud-stat">
                <span class="hud-label">RAM</span>
                <span class="hud-value" id="hud-ram">0</span>
            </div>
        </div>

        <div id="play-area">
            <div id="grid-container">
                </div>
        </div>

        <div class="hud-bottom">
            <button class="powerup-btn" id="btn-peek" onclick="Game.usePowerup('peek')">
                RE-SCAN
                <span class="powerup-cost">50 RAM</span>
            </button>
            <button class="powerup-btn" id="btn-freeze" onclick="Game.usePowerup('freeze')">
                FREEZE Timer
                <span class="powerup-cost">30 RAM</span>
            </button>
        </div>
    </div>

<script>
/**
 * AUDIO ENGINE
 * Uses Web Audio API to generate sounds procedurally.
 */
class AudioSys {
    constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = 0.3; // Volume
        this.masterGain.connect(this.ctx.destination);
    }

    playTone(freq, type, duration, slide = 0) {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        if (slide !== 0) {
            osc.frequency.exponentialRampToValueAtTime(freq + slide, this.ctx.currentTime + duration);
        }

        gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);

        osc.connect(gain);
        gain.connect(this.masterGain);
        
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
    }

    sfxHover() { this.playTone(300, 'sine', 0.05); }
    sfxClick() { this.playTone(600, 'square', 0.1, -200); }
    sfxPattern() { this.playTone(1000, 'sine', 0.15); }
    sfxSuccess() { 
        this.playTone(600, 'triangle', 0.2); 
        setTimeout(() => this.playTone(900, 'triangle', 0.4), 100);
    }
    sfxFail() { 
        this.playTone(150, 'sawtooth', 0.4, -50); 
        setTimeout(() => this.playTone(100, 'sawtooth', 0.4, -20), 100);
    }
    sfxPowerup() { this.playTone(2000, 'sine', 0.5, -1000); }
}

/**
 * BACKGROUND VISUALS
 */
class Visuals {
    constructor() {
        this.canvas = document.getElementById('bg-canvas');
        this.ctx = this.canvas.getContext('2d');
        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.particles = [];
        this.animate();
    }

    resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
    }

    createParticle(x, y, color) {
        this.particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 3,
            vy: (Math.random() - 0.5) * 3,
            life: 1,
            color: color,
            size: Math.random() * 4 + 2
        });
    }

    animate() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        
        // Spawn random background bits
        if (Math.random() < 0.15) {
            this.particles.push({
                x: Math.random() * this.canvas.width,
                y: -20,
                vx: 0, vy: Math.random() * 5 + 2,
                life: 1,
                color: Math.random() > 0.5 ? '#00f3ff' : '#ff00ff',
                size: Math.random() * 3 + 1
            });
        }

        for (let i = this.particles.length - 1; i >= 0; i--) {
            let p = this.particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.015;
            
            this.ctx.globalAlpha = p.life;
            this.ctx.fillStyle = p.color;
            this.ctx.fillRect(p.x, p.y, p.size, p.size * 3); 

            if (p.life <= 0) this.particles.splice(i, 1);
        }
        requestAnimationFrame(() => this.animate());
    }
}

/**
 * CORE GAME LOGIC
 */
const Game = {
    audio: new AudioSys(),
    visuals: new Visuals(),
    
    // State
    mode: null,
    level: 1,
    score: 0,
    ram: 0,
    lives: 3,
    gridSize: 3,
    pattern: [],
    viruses: [],
    inputActive: false,
    timer: null,
    timeLeft: 0,
    maxTime: 0,
    blitzInterval: null,
    blitzTime: 60,
    
    // Config
    config: {
        baseTime: 2000, 
        inputTime: 5000, 
    },

    init() {
        this.loadData();
        this.updateMenuUI();
    },

    loadData() {
        const saved = localStorage.getItem('neuralBreachSave');
        if (saved) {
            const data = JSON.parse(saved);
            this.ram = data.ram || 0;
        }
    },

    saveData() {
        localStorage.setItem('neuralBreachSave', JSON.stringify({ ram: this.ram }));
    },

    resetData() {
        if(confirm("Wipe System Memory? This cannot be undone.")) {
            localStorage.removeItem('neuralBreachSave');
            this.ram = 0;
            this.updateMenuUI();
        }
    },

    start(mode) {
        this.mode = mode;
        this.score = 0;
        if(this.blitzInterval) clearInterval(this.blitzInterval);
        
        // Mode Specific Setup
        if (mode === 'campaign') {
            this.level = 1;
            this.lives = 3;
        } else if (mode === 'endless') {
            this.level = 1;
            this.lives = 1;
        } else if (mode === 'blitz') {
            this.level = 1;
            this.lives = Infinity; 
            this.blitzTime = 60;
            this.startBlitzTimer();
        }

        document.getElementById('menu-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('game-container').classList.remove('hidden');
        
        this.updateHUD();
        this.startLevel();
    },

    startBlitzTimer() {
        const hudLevel = document.getElementById('hud-level');
        hudLevel.innerText = this.blitzTime + "s";
        this.blitzInterval = setInterval(() => {
            this.blitzTime--;
            hudLevel.innerText = this.blitzTime + "s";
            if(this.blitzTime <= 0) this.gameOver("Time Limit Exceeded");
        }, 1000);
    },

    startLevel() {
        this.inputActive = false;
        this.pattern = [];
        this.viruses = [];
        this.currentInputCount = 0;
        document.getElementById('grid-container').style.transform = 'none';
        
        // Difficulty Scaling
        let size = 3;
        let patternCount = 3;
        let virusCount = 0;
        let showTime = 1500;
        
        if (this.mode === 'campaign' || this.mode === 'endless') {
            size = Math.min(6, 3 + Math.floor((this.level - 1) / 4));
            patternCount = Math.min(size*size - 3, 3 + Math.floor((this.level - 1) / 2.5));
            virusCount = this.level > 6 ? Math.floor(this.level / 4) : 0;
            showTime = Math.max(600, 1500 - (this.level * 40));
        } else {
            size = Math.min(5, 3 + Math.floor(this.score / 600));
            patternCount = Math.min(size*size-2, 3 + Math.floor(this.score / 400));
            showTime = 1000;
        }

        this.gridSize = size;
        this.generateGrid(size);
        this.generatePattern(size, patternCount, virusCount);
        
        this.updateHUD();
        
        setTimeout(() => {
            this.showPattern();
            setTimeout(() => {
                this.hidePattern();
                this.enableInput();
            }, showTime);
        }, 500);
    },

    generateGrid(size) {
        const container = document.getElementById('grid-container');
        container.innerHTML = '';
        container.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
        
        const containerPadding = 30;
        const totalGap = (size - 1) * 10;
        const maxWidth = Math.min(window.innerWidth - 40, 600) - containerPadding - totalGap;
        const tileSize = Math.floor(maxWidth / size);
        
        for (let i = 0; i < size * size; i++) {
            const tile = document.createElement('div');
            tile.className = 'tile';
            tile.style.height = `${tileSize}px`;
            tile.dataset.index = i;
            tile.onclick = () => this.handleTileClick(i);
            tile.onmouseenter = () => this.audio.sfxHover();
            container.appendChild(tile);
        }
    },

    generatePattern(size, count, vCount) {
        const total = size * size;
        const indices = Array.from({length: total}, (_, i) => i);
        
        for (let i = indices.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [indices[i], indices[j]] = [indices[j], indices[i]];
        }

        this.pattern = indices.slice(0, count);
        this.viruses = indices.slice(count, count + vCount);
    },

    showPattern() {
        const tiles = document.querySelectorAll('.tile');
        this.pattern.forEach(idx => {
            tiles[idx].classList.add('active-pattern');
        });
        this.audio.sfxPattern();
        
        if (this.viruses.length > 0 && this.level > 8) {
            this.viruses.forEach(idx => tiles[idx].classList.add('virus'));
        }
    },

    hidePattern() {
        const tiles = document.querySelectorAll('.tile');
        tiles.forEach(t => {
            t.classList.remove('active-pattern');
            t.classList.remove('virus');
        });
        
        if (this.level >= 12 && this.mode === 'campaign') {
             document.getElementById('grid-container').style.transform = Math.random() > 0.5 ? 'rotate(90deg)' : 'rotate(-90deg)';
        }
    },

    enableInput() {
        this.inputActive = true;
        this.startInputTimer();
    },

    startInputTimer() {
        const bar = document.getElementById('timer-bar');
        bar.style.transition = 'none';
        bar.style.width = '100%';
        bar.style.backgroundColor = '#ff00ff'; // Reset color
        
        void bar.offsetWidth; // Force reflow

        const time = 5000 + (this.level * 250); 
        bar.style.transition = `width ${time}ms linear`;
        bar.style.width = '0%';

        if(this.timer) clearTimeout(this.timer);
        this.timer = setTimeout(() => {
            if(this.inputActive) this.failLevel("Time Out - Connection Lost");
        }, time);
    },

    handleTileClick(index) {
        if (!this.inputActive) return;

        const tile = document.querySelector(`.tile[data-index='${index}']`);
        
        if (tile.classList.contains('revealed-success') || tile.classList.contains('revealed-fail')) return;

        // Check Logic
        if (this.viruses.includes(index)) {
            // Hit a virus
            tile.classList.add('virus', 'exposed');
            this.audio.sfxFail();
            // FIXED: Replaced CSS var with hex code
            this.createClickParticles(tile, '#ff4444');
            this.failLevel("Firewall Triggered (Virus Hit)");
            return;
        }

        if (this.pattern.includes(index)) {
            // Correct
            tile.classList.add('revealed-success');
            this.createClickParticles(tile, '#0aff00');
            this.audio.sfxClick();
            this.currentInputCount++;
            
            if (this.currentInputCount === this.pattern.length) {
                this.completeLevel();
            }
        } else {
            // Wrong
            tile.classList.add('revealed-fail');
            this.audio.sfxFail();
            this.createClickParticles(tile, '#ff4444'); // Red particles for error
            
            if (this.mode === 'campaign') {
                this.lives--;
                this.showToast(`Caution: ${this.lives} Attempts Remain`);
                if (this.lives <= 0) this.failLevel("System Locked (Too Many Errors)");
            } else if (this.mode === 'endless') {
                 this.failLevel("Pattern Mismatch");
            }
        }
    },

    createClickParticles(element, color) {
        const rect = element.getBoundingClientRect();
        const cx = rect.left + rect.width/2;
        const cy = rect.top + rect.height/2;
        for(let i=0; i<15; i++) {
            this.visuals.createParticle(cx, cy, color || '#0aff00');
        }
    },

    completeLevel() {
        this.inputActive = false;
        clearTimeout(this.timer);
        this.audio.sfxSuccess();
        
        const base = 150;
        const multiplier = this.level;
        const pts = base * multiplier;
        const ramGain = Math.floor(pts / 15) + 5;
        
        this.score += pts;
        this.ram += ramGain;
        this.saveData();
        
        this.showToast(`Protocol ${this.level} Bypassed. +${ramGain} RAM`);
        
        setTimeout(() => {
            this.level++;
            this.startLevel();
        }, 1200);
    },

    failLevel(reason) {
        this.inputActive = false;
        clearTimeout(this.timer);
        if(this.blitzInterval) clearInterval(this.blitzInterval);
        
        const tiles = document.querySelectorAll('.tile');
        this.pattern.forEach(idx => tiles[idx].classList.add('active-pattern'));
        
        setTimeout(() => {
            this.gameOver(reason);
        }, 2000);
    },

    gameOver(reason = "Connection Terminated") {
        document.getElementById('game-container').classList.add('hidden');
        const res = document.getElementById('result-screen');
        res.classList.remove('hidden');
        
        document.getElementById('result-title').innerText = "SYSTEM FAILURE";
        document.getElementById('result-title').style.color = "#ff4444";
        document.getElementById('result-score').innerText = `Final Score: ${this.score}`;
        document.getElementById('result-details').innerText = reason;

        const nextBtn = document.getElementById('next-level-btn');
        if (this.mode === 'campaign') {
             nextBtn.innerText = "Retry Level " + this.level;
             nextBtn.onclick = () => {
                 this.lives = 3;
                 this.start(this.mode); 
                 document.getElementById('result-screen').classList.add('hidden');
             };
             nextBtn.style.display = 'inline-block';
        } else {
            nextBtn.style.display = 'none';
        }
    },
    
    showMenu() {
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('game-container').classList.add('hidden');
        document.getElementById('menu-screen').classList.remove('hidden');
        this.updateMenuUI();
        if(this.blitzInterval) clearInterval(this.blitzInterval);
    },

    usePowerup(type) {
        if (!this.inputActive) return;
        
        const costs = { 'peek': 50, 'freeze': 30 };
        
        if (this.ram >= costs[type]) {
            this.ram -= costs[type];
            this.updateHUD();
            this.audio.sfxPowerup();
            
            if (type === 'peek') {
                this.showToast("Re-scanning...");
                const tiles = document.querySelectorAll('.tile');
                this.pattern.forEach(idx => tiles[idx].classList.add('active-pattern'));
                setTimeout(() => {
                     tiles.forEach(t => t.classList.remove('active-pattern'));
                }, 800);
            } else if (type === 'freeze') {
                this.showToast("Timer Frozen");
                clearTimeout(this.timer);
                document.getElementById('timer-bar').style.transition = 'none';
                // FIXED: Replaced CSS var with hex code
                document.getElementById('timer-bar').style.backgroundColor = '#00f3ff';
            }
        } else {
            this.showToast("Insufficient RAM");
            this.audio.sfxFail();
        }
    },

    updateHUD() {
        document.getElementById('hud-level').innerText = this.mode === 'blitz' ? this.blitzTime + 's' : this.level;
        document.getElementById('hud-score').innerText = this.score;
        document.getElementById('hud-ram').innerText = this.ram;
        
        document.getElementById('btn-peek').disabled = this.ram < 50;
        document.getElementById('btn-freeze').disabled = this.ram < 30;
    },
    
    updateMenuUI() {
        document.getElementById('menu-ram').innerText = this.ram;
    },

    showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.style.opacity = 1;
        t.style.top = '25%';
        setTimeout(() => {
            t.style.opacity = 0;
            t.style.top = '20%';
        }, 2500);
    },
    
    nextLevel() {
        this.start(this.mode);
    }
};

window.onload = () => Game.init();
</script>
</body>
</html>
